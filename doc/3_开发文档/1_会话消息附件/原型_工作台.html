<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>原型：聊天工作台（里程碑4）</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.5 "Microsoft YaHei", sans-serif; background: #f0f2f5; }
  header { height: 52px; background: #fff; border-bottom: 1px solid #e4e7ed; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .layout { display: flex; height: calc(100vh - 52px); }
  .left { width: 240px; background: #fff; border-right: 1px solid #e4e7ed; padding: 12px; }
  .main { flex: 1; display: flex; flex-direction: column; padding: 12px; }
  .right { width: 360px; background: #fff; border-left: 1px solid #e4e7ed; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .btn { background: #409eff; color: #fff; border: 0; border-radius: 4px; padding: 8px 0; width: 100%; cursor: pointer; }
  .conv { padding: 8px 10px; border-radius: 4px; margin-top: 6px; cursor: pointer; display: flex; justify-content: space-between; }
  .conv:hover, .conv.active { background: #ecf5ff; }
  .conv .ops { color: #909399; visibility: hidden; }
  .conv:hover .ops { visibility: visible; }
  .chat { flex: 1; background: #fff; border: 1px solid #e4e7ed; border-radius: 4px; display: flex; flex-direction: column; }
  .msgs { flex: 1; padding: 16px; overflow: auto; }
  .bubble { max-width: 70%; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; }
  .bubble.user { background: #409eff; color: #fff; margin-left: auto; }
  .bubble.assistant { background: #f4f4f5; }
  .inputbar { border-top: 1px solid #e4e7ed; padding: 10px; display: flex; gap: 8px; }
  textarea { flex: 1; height: 52px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 8px; resize: none; }
  .panel { border: 1px solid #e4e7ed; border-radius: 4px; padding: 12px; flex: 1; }
  .panel h3 { font-size: 14px; margin-bottom: 8px; color: #303133; }
  .ph { border: 1px dashed #dcdfe6; border-radius: 4px; color: #c0c4cc; display: flex; align-items: center; justify-content: center; height: 90px; }
  .tag { display: inline-block; padding: 0 6px; border: 1px solid #dcdfe6; border-radius: 3px; color: #909399; font-size: 12px; }
</style>
</head>
<body>
<header>
  <b>经营归因分析系统</b>
  <div>唐同学（分析用户） <button class="btn" style="width:auto;padding:6px 12px;background:#909399;">退出登录</button> <button class="btn" style="width:auto;padding:6px 12px;background:#67c23a;">附件(3)</button></div>
</header>
<div class="layout">
  <div class="left">
    <button class="btn">+ 新建会话</button>
    <div class="conv active"><span>近30天转化率下降分析</span><span class="ops">✏ 🗑</span></div>
    <div class="conv"><span>评论评分下滑归因</span><span class="ops">✏ 🗑</span></div>
    <div class="conv"><span>加购未下单人群</span><span class="ops">✏ 🗑</span></div>
    <p style="color:#c0c4cc;font-size:12px;margin-top:10px;">悬停出现重命名/删除；点击切换会话并回放历史消息</p>
  </div>
  <div class="main">
    <div class="chat">
      <div class="msgs">
        <div class="bubble user">近30天下单转化率如何？</div>
        <div class="bubble assistant">近30天下单转化率 3.2%，环比下降 4.9 个百分点……</div>
        <div class="bubble user">哪个人群跌得最厉害？</div>
        <div class="bubble assistant">移动端自然流量跌幅最大：8.1% → 3.2%……</div>
      </div>
      <div class="inputbar">
        <textarea placeholder="输入分析问题（回车发送）"></textarea>
        <button class="btn" style="width:72px;">发送</button>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="panel"><h3>实时任务</h3><div class="ph">暂无运行中的任务</div></div>
    <div class="panel"><h3>结果展示</h3><div class="ph">暂无分析结果</div></div>
  </div>
</div>
<p style="padding:8px 16px;color:#909399;">附件侧栏（右侧抽屉）：文件名 / 类型 / 大小 / 上传时间 / 解析状态 + 上传、删除、下载</p>
</body>
</html>
